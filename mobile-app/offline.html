<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#141210" />
  <title>Obrium — offline</title>
  <link rel="stylesheet" href="styles/theme.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg, #141210);
      color: var(--fg, #f7f3ee);
      font-family: var(--font-ui, system-ui, sans-serif);
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: var(--fg-muted, #9e968c); margin: 0 0 20px; max-width: 28rem; }
    a.btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--gold, #f6c36a);
      color: #1a1510;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Obrium is offline</h1>
    <p>This page was saved on your device. Check your connection, then try again. Nothing new was sent.</p>
    <a class="btn" href="./">Back to Obrium</a>
  </main>
</body>
</html>
